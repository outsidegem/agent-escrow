name: Enterprise Release Gates
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - run: npm ci
    - name: Typecheck
      run: npx tsc --noEmit
    - name: Security & Red Team Suite
      run: npm test
    - name: Build Distribution
      run: npx tsc
